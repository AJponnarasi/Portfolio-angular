<div class="scroll-progress" [style.width.%]="scrollProgress"></div>

<header class="site-header" [class.scrolled]="isScrolled">
    <div class="header-inner">
        <a href="#home" class="brand">PONNARASI<span>.</span></a>

        <nav class="desktop-nav" aria-label="Primary">
            <a *ngFor="let item of NAV_ITEMS" [href]="'#' + item.id" [class.active]="activeSection === item.id">
                {{ item.label }}
            </a>
        </nav>

        <div class="header-actions">
            <a *ngIf="resume.available()" [href]="resume.url" [attr.download]="resume.fileName"
                class="btn btn-outline header-cta">
                <i class="fas fa-download text-xs"></i> Resume
            </a>
            <a href="#contact" class="btn btn-solid header-cta">Let's Talk</a>
        </div>

        <button type="button" class="theme-toggle" (click)="theme.toggle()"
            [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
            [attr.title]="theme.theme() === 'dark' ? 'Light mode' : 'Dark mode'">
            <i class="fas" [ngClass]="theme.theme() === 'dark' ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
        </button>

        <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuVisible"
            aria-label="Toggle navigation">
            <i class="fas" [ngClass]="isMenuVisible ? 'fa-xmark' : 'fa-bars-staggered'"></i>
        </button>
    </div>
</header>

<!-- Mobile floating pill navigation -->
<nav class="mobile-nav" [class.open]="isMenuVisible" aria-label="Mobile">
    <a *ngFor="let item of NAV_ITEMS" [href]="'#' + item.id" (click)="isMenuVisible = false"
        [class.active]="activeSection === item.id" [attr.aria-label]="item.label">
        <i [ngClass]="item.icon"></i>
    </a>
    <a *ngIf="resume.available()" [href]="resume.url" [attr.download]="resume.fileName" class="resume-link"
        aria-label="Download resume">
        <i class="fas fa-download"></i>
    </a>
</nav>

<main>
    <section id="home" class="overflow-hidden">
        <app-home></app-home>
    </section>
    <section id="skills" class="min-h-fit bg-bg_light_primary">
        <app-skills></app-skills>
    </section>
    <section id="services">
        <app-services></app-services>
    </section>
    <section id="experience" class="min-h-fit bg-bg_light_primary">
        <app-experience></app-experience>
    </section>
    <section id="projects">
        <app-project></app-project>
    </section>
    <section id="contact" class="bg-dark_primary text-white">
        <app-contact></app-contact>
    </section>
</main>
<app-footer></app-footer>
