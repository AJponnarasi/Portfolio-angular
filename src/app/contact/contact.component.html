<div class="md:container mx-auto px-5 py-20 relative overflow-hidden">
    <div class="glow"></div>

    <span class="section-eyebrow eyebrow-on-dark" data-aos="fade-down">Contact Me</span>
    <h2 class="subtitle subtitle-on-dark" data-aos="fade-down">GET IN TOUCH</h2>
    <p class="lead" data-aos="fade-down">
        Have a project in mind or an opportunity to discuss? My inbox is always open — I'll get back to you soon.
    </p>

    <div class="grid gap-10 md:grid-cols-5 mt-10 relative">
        <form data-aos="fade-up" class="md:col-span-3 form-card"
            action="https://submit-form.com/vtcoKsHLNuIfSsHeThxtd" target="_blank">
            <div class="grid sm:grid-cols-2 gap-4">
                <label class="field">
                    <span>Name</span>
                    <input type="text" name="from_name" placeholder="Your name" required>
                </label>
                <label class="field">
                    <span>Email</span>
                    <input type="email" name="user_email" pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{1,63}$"
                        placeholder="you@example.com" required>
                </label>
            </div>
            <label class="field">
                <span>Message</span>
                <textarea name="message" placeholder="Tell me about your project..." rows="6" required></textarea>
            </label>
            <button class="btn submit-btn self-start">
                Send Message <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </form>

        <div class="md:col-span-2 flex flex-col gap-4">
            <a data-aos="fade-left" data-aos-delay="0" class="info-card" href="mailto:ajpkponnarasi6@gmail.com">
                <span class="info-icon"><i class="fas fa-envelope"></i></span>
                <div>
                    <span class="info-label">Email</span>
                    <span class="info-value">ajpkponnarasi6&#64;gmail.com</span>
                </div>
            </a>
            <a data-aos="fade-left" data-aos-delay="150" class="info-card" href="tel:+919344495735">
                <span class="info-icon"><i class="fas fa-phone"></i></span>
                <div>
                    <span class="info-label">Phone</span>
                    <span class="info-value">+91 93444 95735</span>
                </div>
            </a>
            <a *ngIf="resume.available()" [href]="resume.url" [attr.download]="resume.fileName"
                data-aos="fade-left" data-aos-delay="300" class="info-card resume-card">
                <span class="info-icon"><i class="fas fa-file-arrow-down"></i></span>
                <div>
                    <span class="info-label">Resume</span>
                    <span class="info-value">Download my CV (PDF)</span>
                </div>
            </a>
            <div data-aos="fade-left" data-aos-delay="450" class="info-card">
                <span class="info-icon"><i class="fas fa-location-dot"></i></span>
                <div>
                    <span class="info-label">Address</span>
                    <span class="info-value">18-7-16(4), Kanniyamman Kovil St,<br>Surandai-627859, Tenkasi</span>
                </div>
            </div>
        </div>
    </div>
</div>
