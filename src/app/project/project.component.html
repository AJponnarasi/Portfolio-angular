<div class="md:container px-5 py-14">
    <h2 class="title" data-aos="fade-down">My Work</h2>
    <h4 class="subtitle" data-aos="fade-down">
        A Showcase of Real-World Front-End Projects
    </h4>
    <br>
    <div class="flex flex-wrap gap-4 justify-center mb-5" data-aos="fade-up">
        <div class="splide" style="width: 70%;">
            <div class="splide__track">
                <ul class="splide__list">
                    <li *ngFor="let project of projects" class="splide__slide">
                        <div
                            class="p-8 h-full rounded-2xl shadow-md bg-bg_light_primary border-2 border-slate-200 transition-all duration-500 ease-in-out transform  relative overflow-hidden">
                            <!-- Icon Tag Top Right -->
                            <div
                                class="absolute top-4 right-4 bg-gradient-to-r from-indigo-300 to-cyan-300  font-bold text-xs rounded-xl px-3 py-1 shadow-sm">
                                {{ project.icon }}
                            </div>
                            <!-- Title -->
                            <h6 class="text-xl font-bold mb-2 text-gray-800">{{ project.title }}</h6>

                            <!-- Description -->
                            <p class="text-sm text-gray-600 mb-4 leading-relaxed">{{ project.description }}</p>

                            <!-- Key Features -->
                            <h5 class="text-sm text-cyan-600 font-semibold mb-2">Key Features</h5>
                            <div class="flex flex-wrap gap-2">
                                <span *ngFor="let feature of project.features"
                                    class="bg-blue-100 text-blue-700 text-xs font-medium px-3 py-1 rounded-full shadow-sm">
                                    {{ feature }}
                                </span>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</div>
