<div class="md:container mx-auto px-5 py-20">
    <span class="section-eyebrow" data-aos="fade-down">My Expertise</span>
    <h2 class="subtitle" data-aos="fade-down">What I Bring to Your Project</h2>

    <div class="grid gap-6 md:grid-cols-3 mt-10">
        <div *ngFor="let service of SERVICE_LIST; let i = index; trackBy: trackByServiceId" data-aos="fade-up"
            [attr.data-aos-delay]="i * 150" class="service-card card-lift group">
            <span class="service-num">0{{ i + 1 }}</span>
            <div class="service-icon">
                <img [src]="service.icon" [alt]="service.title" class="w-9 h-9" />
            </div>
            <h3 class="card-title mt-6 mb-3 !text-xl">{{ service.title }}</h3>
            <p class="leading-relaxed text-sm text-body font-Poppins">{{ service.description }}</p>
            <div class="flex flex-wrap gap-2 mt-6">
                <span *ngFor="let tech of service.techStack"
                    class="tech-tag rounded-full px-3 py-1 text-xs font-medium font-Poppins">
                    {{ tech }}
                </span>
            </div>
        </div>
    </div>
</div>
